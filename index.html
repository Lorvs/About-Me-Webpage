<!DOCTYPE html>
<html>

<head>
  <title>Welcome</title>

  <style>
    body {
      background-image:
        linear-gradient(rgba(11, 36, 24, 0.45), rgba(11, 36, 24, 0.45)),
        url("Background.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .profile-picture {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border: 6px solid #2e8b57;
      border-radius: 20px;
      margin-top: 50px;
    }

    h1 {
      color: #123524;
      font-size: 50px;
      margin-top: 30px;
    }

    p {
      font-size: 22px;
    }

    .enter-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background-color: #2e8b57;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    .enter-button:hover {
      background-color: #123524;
    }
  </style>
</head>

<body>

  <img src="me.jpg" alt="A picture of me" class="profile-picture">

  <h1>Welcome to My World</h1>

  <p>
    I'm <b>Lorvan Arnado</b>
  </p>

  <p>
    Welcome to my personal webpage!
  </p>

  <a href="about.html" class="enter-button">Enter My World</a>

</body>

</html>
